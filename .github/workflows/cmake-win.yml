name: CI Windows

# Builds plastimatch on Windows (x64, MSVC 2022) and uploads a self-contained binary
# package.
#
# See the header comment in cmake-linux.yml for the dependency strategy: ITK, DCMTK and dlib
# are built from source as static libraries, each with its own cache entry. On Windows there
# is no packaged alternative anyway, so the first run without caches is long (roughly an hour
# for ITK) -- hence the generous timeout. Later runs restore the caches and only compile
# plastimatch itself.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ITK_VERSION: 5.4.0
  DCMTK_VERSION: 3.6.8
  # The bundled libs/dlib-19.1 cannot be used: it still relies on std::binary_function,
  # removed in C++17, and ITK 5.4 forces C++17 on consumers via
  # INTERFACE_COMPILE_FEATURES. plastimatch supports linking a real dlib -- the dlib .cpp
  # includes in src/sys/dlib_threads.cxx are guarded by !DLIB_HAVE_LIBRARY -- so build a
  # current one instead.
  DLIB_VERSION: 19.24.9
  # Per-dependency cache epochs. Because each dependency has its own cache entry, bumping
  # one rebuilds only that dependency -- useful after changing its cmake options, which are
  # not themselves part of the cache key.
  ITK_CACHE_EPOCH: v2
  DCMTK_CACHE_EPOCH: v3
  DLIB_CACHE_EPOCH: v3

jobs:
  build-windows:

    runs-on: windows-2022
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      # fetch-depth: 0 is required: CMakeLists.txt runs `git describe --always` to compute
      # PLASTIMATCH_VERSION_STRING and PLM_VERSION_TWEAK.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '17'
          msbuild-architecture: x64

      ##------------------------------------------------------------------------------
      ##  ITK
      ##------------------------------------------------------------------------------
      - name: Restore ITK cache
        id: cache-itk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\deps\itk
          key: windows-x64-itk-${{ env.ITK_CACHE_EPOCH }}-${{ env.ITK_VERSION }}

      # A cache saved from a half-finished build would have the CMake config files but not
      # the libraries, which only surfaces much later as a link error. Require a real library.
      - name: Check ITK cache
        id: check-itk
        shell: bash
        run: |
          ok=false
          if [ "${{ steps.cache-itk.outputs.cache-hit }}" == "true" ] \
             && ls "$RUNNER_TEMP"/deps/itk/lib/ITKCommon-*.lib >/dev/null 2>&1; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable ITK cache: $ok"

      - name: Build ITK
        id: build-itk
        if: steps.check-itk.outputs.ok != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = "$env:RUNNER_TEMP\deps"
          New-Item -ItemType Directory -Force -Path "$deps\src" | Out-Null
          Set-Location "$deps\src"
          Invoke-WebRequest -Uri "https://github.com/InsightSoftwareConsortium/ITK/releases/download/v$env:ITK_VERSION/InsightToolkit-$env:ITK_VERSION.tar.gz" -OutFile itk.tar.gz
          tar xzf itk.tar.gz
          cmake -S "$deps\src\InsightToolkit-$env:ITK_VERSION" -B "$deps\build-itk" -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$deps\itk" `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_TESTING=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DITK_USE_SYSTEM_ZLIB=OFF `
            -DModule_ITKReview=ON
          if ($LASTEXITCODE -ne 0) { throw "ITK configure failed" }
          cmake --build "$deps\build-itk" --config Release --target INSTALL -- /m
          if ($LASTEXITCODE -ne 0) { throw "ITK build failed" }

      # Saved as soon as ITK itself is installed, so a later DCMTK/dlib/plastimatch failure
      # does not throw this build away. `cmake --build --target INSTALL` returning 0 means
      # the install tree is complete, which is a precise signal -- no need to proxy it
      # through the success of a later step. !cancelled() keeps the step eligible when a
      # later step has already failed; steps.build-itk.outcome does the real gating, so a
      # cancelled or failed ITK build is never snapshotted.
      - name: Save ITK cache
        if: ${{ !cancelled() && steps.build-itk.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\deps\itk
          key: ${{ steps.cache-itk.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  DCMTK
      ##------------------------------------------------------------------------------
      - name: Restore DCMTK cache
        id: cache-dcmtk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\deps\dcmtk
          key: windows-x64-dcmtk-${{ env.DCMTK_CACHE_EPOCH }}-${{ env.DCMTK_VERSION }}

      - name: Check DCMTK cache
        id: check-dcmtk
        shell: bash
        run: |
          ok=false
          if [ "${{ steps.cache-dcmtk.outputs.cache-hit }}" == "true" ] \
             && [ -f "$RUNNER_TEMP/deps/dcmtk/lib/dcmdata.lib" ]; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable DCMTK cache: $ok"

      # DCMTK must use the same C runtime as ITK, dlib and plastimatch, all of which take
      # CMake's default /MD. DCMTK_OVERWRITE_WIN32_COMPILER_FLAGS=OFF alone did not achieve
      # that -- DCMTK still produced MT_StaticRelease objects and linking plastimatch failed
      # with LNK2038 "mismatch detected for 'RuntimeLibrary'". CMAKE_MSVC_RUNTIME_LIBRARY is
      # no help either: DCMTK 3.6.8 declares cmake_minimum_required(3.10), so policy CMP0091
      # is OLD and the variable is ignored. Pin the runtime by spelling out the Release
      # flags, which otherwise match CMake's own defaults.
      #
      # CMAKE_CXX_STANDARD=17 matters: left at its default, DCMTK 3.6.8 reports "C++11
      # features disabled" and falls back to the pre-C++11 OFrvalue emulation in
      # ofstd/include/dcmtk/ofstd/ofutil.h, which newer compilers reject outright (AppleClang
      # 17: "no member named 'pt' in OFrvalue_storage<T, >"). plastimatch compiles those same
      # headers under C++17, so the emulation has to be off here too.
      #
      # BUILD_APPS=OFF skips the ~30 command line tools; plastimatch only links the
      # libraries. The optional backends are off to keep the static link self-contained
      # (costs deflated transfer syntax, TLS, and DICOM character-set conversion) and to keep
      # the three platforms configured identically.
      - name: Build DCMTK
        id: build-dcmtk
        if: steps.check-dcmtk.outputs.ok != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = "$env:RUNNER_TEMP\deps"
          New-Item -ItemType Directory -Force -Path "$deps\src" | Out-Null
          Set-Location "$deps\src"
          Invoke-WebRequest -Uri "https://github.com/DCMTK/dcmtk/archive/refs/tags/DCMTK-$env:DCMTK_VERSION.tar.gz" -OutFile dcmtk.tar.gz
          tar xzf dcmtk.tar.gz
          cmake -S "$deps\src\dcmtk-DCMTK-$env:DCMTK_VERSION" -B "$deps\build-dcmtk" -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$deps\dcmtk" `
            -DCMAKE_CXX_STANDARD=17 `
            -DDCMTK_ENABLE_CXX11=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_APPS=OFF `
            -DDCMTK_OVERWRITE_WIN32_COMPILER_FLAGS=OFF `
            "-DCMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" `
            -DDCMTK_WITH_ZLIB=OFF `
            -DDCMTK_WITH_OPENSSL=OFF `
            -DDCMTK_WITH_PNG=OFF `
            -DDCMTK_WITH_TIFF=OFF `
            -DDCMTK_WITH_XML=OFF `
            -DDCMTK_WITH_ICONV=OFF `
            -DDCMTK_WITH_ICU=OFF `
            -DDCMTK_WITH_SNDFILE=OFF `
            -DDCMTK_ENABLE_CHARSET_CONVERSION=OFF
          if ($LASTEXITCODE -ne 0) { throw "DCMTK configure failed" }
          cmake --build "$deps\build-dcmtk" --config Release --target INSTALL -- /m
          if ($LASTEXITCODE -ne 0) { throw "DCMTK build failed" }

      - name: Save DCMTK cache
        if: ${{ !cancelled() && steps.build-dcmtk.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\deps\dcmtk
          key: ${{ steps.cache-dcmtk.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  dlib
      ##------------------------------------------------------------------------------
      - name: Restore dlib cache
        id: cache-dlib
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\deps\dlib
          key: windows-x64-dlib-${{ env.DLIB_CACHE_EPOCH }}-${{ env.DLIB_VERSION }}

      # dlib appends a version/config/compiler suffix to its static library name on MSVC
      # (e.g. dlib19.24.9_release_64bit_msvc1943.lib), so match by prefix.
      - name: Check dlib cache
        id: check-dlib
        shell: bash
        run: |
          ok=false
          if [ "${{ steps.cache-dlib.outputs.cache-hit }}" == "true" ] \
             && ls "$RUNNER_TEMP"/deps/dlib/lib/dlib*.lib >/dev/null 2>&1; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable dlib cache: $ok"

      # Minimal dlib: plastimatch only uses the optimization, threading, svm and command
      # line parser headers, so the GUI/BLAS backends are off to keep the static link
      # self-contained.
      #
      # PNG and JPEG support must stay ON even though plastimatch never loads images.
      # dlib/image_io.h -- reached via dlib/data_io.h -- unconditionally includes
      # png_loader.h and jpeg_loader.h, and with support off both spell their guard as
      # COMPILE_TIME_ASSERT(sizeof(T) == 0). T is an undeclared, non-dependent name, so that
      # is a hard parse-time error rather than one deferred to instantiation.
      # PNG_FOUND=0/JPEG_FOUND=0 take the deliberate early-out in dlib's
      # cmake_utils/find_lib{png,jpeg}.cmake ("if (DEFINED ..._FOUND) return()"), which makes
      # dlib statically compile its own bundled libpng/zlib/libjpeg into libdlib.a instead of
      # linking the system copies -- so the package stays self-contained.
      - name: Build dlib
        id: build-dlib
        if: steps.check-dlib.outputs.ok != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = "$env:RUNNER_TEMP\deps"
          New-Item -ItemType Directory -Force -Path "$deps\src" | Out-Null
          Set-Location "$deps\src"
          Invoke-WebRequest -Uri "https://github.com/davisking/dlib/archive/refs/tags/v$env:DLIB_VERSION.tar.gz" -OutFile dlib.tar.gz
          tar xzf dlib.tar.gz
          cmake -S "$deps\src\dlib-$env:DLIB_VERSION" -B "$deps\build-dlib" -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$deps\dlib" `
            -DCMAKE_CXX_STANDARD=17 `
            -DBUILD_SHARED_LIBS=OFF `
            -DDLIB_NO_GUI_SUPPORT=ON `
            -DDLIB_PNG_SUPPORT=ON `
            -DPNG_FOUND=0 `
            -DDLIB_JPEG_SUPPORT=ON `
            -DJPEG_FOUND=0 `
            -DDLIB_GIF_SUPPORT=OFF `
            -DDLIB_WEBP_SUPPORT=OFF `
            -DDLIB_USE_BLAS=OFF `
            -DDLIB_USE_LAPACK=OFF `
            -DDLIB_USE_CUDA=OFF `
            -DDLIB_USE_MKL_FFT=OFF `
            -DDLIB_LINK_WITH_SQLITE3=OFF
          if ($LASTEXITCODE -ne 0) { throw "dlib configure failed" }
          cmake --build "$deps\build-dlib" --config Release --target INSTALL -- /m
          if ($LASTEXITCODE -ne 0) { throw "dlib build failed" }

      - name: Save dlib cache
        if: ${{ !cancelled() && steps.build-dlib.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\deps\dlib
          key: ${{ steps.cache-dlib.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  plastimatch
      ##------------------------------------------------------------------------------
      # PLM_PACKAGE_WIX=OFF selects the ZIP CPack generator instead of the default WIX
      # installer, so all three platforms produce a plain archive. Building the MSI would
      # additionally depend on the WiX toolset being present on the runner.
      #
      # dlib_INCLUDE_DIR is passed explicitly because src/CMakeLists.txt copies it into
      # DLIB_INCLUDE_DIR, which src/clp consumes as a plain include path rather than through
      # the dlib::dlib target.
      # CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON is required for dlib. On a case-insensitive
      # filesystem (macOS), find_package(dlib) looking for "Finddlib.cmake" in MODULE mode
      # matches plastimatch's own cmake/FindDlib.cmake, a legacy module that searches for a
      # system dlib, fails, and prevents CONFIG mode from ever running -- so dlib_DIR was
      # ignored as an unused variable and the bundled libs/dlib-19.1 got compiled instead.
      # Preferring CONFIG picks up dlibConfig.cmake and makes all platforms resolve
      # dependencies the same way; packages without a config file still fall back to MODULE.
      #
      # /Zc:__cplusplus is required by DCMTK. Its installed osconfig.h guards on
      # `defined(HAVE_CXX11) && defined(__cplusplus) && __cplusplus < 201103L`, and MSVC
      # reports __cplusplus as 199711L regardless of /std: unless this flag is given. DCMTK's
      # own build passes it, which is why DCMTK compiled but plastimatch failed with C1189
      # "DCMTK was configured to use C++11 features, but your compiler does not ... provide
      # them". CMake appends a command line CMAKE_CXX_FLAGS to the platform defaults, so the
      # usual /DWIN32 /EHsc /GR flags are preserved.
      - name: Configure plastimatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = "$env:RUNNER_TEMP\deps"
          $itkDir = (Get-Item "$deps\itk\lib\cmake\ITK-*\ITKConfig.cmake").Directory.FullName
          # DCMTK and dlib install their config files under different subdirectories on
          # Windows than on Unix, so locate them rather than hardcoding paths.
          $dcmtkDir = (Get-ChildItem -Path "$deps\dcmtk" -Recurse -Filter DCMTKConfig.cmake | Select-Object -First 1).Directory.FullName
          $dlibDir = (Get-ChildItem -Path "$deps\dlib" -Recurse -Filter dlibConfig.cmake | Select-Object -First 1).Directory.FullName
          # Hand CMake forward slashes. dlib_INCLUDE_DIR reaches plastimatch's
          # PlmMacros.cmake, which embeds it in a $<BUILD_INTERFACE:...> generator
          # expression; a Windows path there fails to parse with
          # "Invalid character escape '\a'" on D:\a\_temp\... . CMake accepts forward
          # slashes on Windows, so normalise every path we pass.
          $itkDir = $itkDir -replace '\\','/'
          $dcmtkDir = $dcmtkDir -replace '\\','/'
          $dlibDir = $dlibDir -replace '\\','/'
          $dlibInclude = ($deps -replace '\\','/') + '/dlib/include'
          Write-Host "ITK_DIR=$itkDir"
          Write-Host "DCMTK_DIR=$dcmtkDir"
          Write-Host "dlib_DIR=$dlibDir"
          Write-Host "dlib_INCLUDE_DIR=$dlibInclude"
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}\build" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CXX_STANDARD=17 `
            "-DCMAKE_CXX_FLAGS=/Zc:__cplusplus" `
            -DBUILD_SHARED_LIBS=OFF `
            "-DITK_DIR=$itkDir" `
            "-DDCMTK_DIR=$dcmtkDir" `
            "-Ddlib_DIR=$dlibDir" `
            "-Ddlib_INCLUDE_DIR=$dlibInclude" `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON `
            -DPLM_SYSTEM_ITK=YES `
            -DPLM_SYSTEM_DCMTK=YES `
            -DPLM_PREFER_SYSTEM_DLIB=ON `
            -DPLM_CONFIG_ENABLE_CUDA=OFF `
            -DPLM_CONFIG_ENABLE_OPENCL=OFF `
            -DPLM_CONFIG_ENABLE_QT=OFF `
            -DPLM_CONFIG_ENABLE_OPENMP=ON `
            -DPLM_PACKAGE_WIX=OFF `
            -DPLM_BUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "plastimatch configure failed" }

      - name: Build plastimatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "${{ github.workspace }}\build" --config Release -- /m
          if ($LASTEXITCODE -ne 0) { throw "plastimatch build failed" }

      # Informational for now: the regression suite has never run in GitHub Actions, so it
      # is not yet gating. Drop continue-on-error once it is known green here.
      - name: Test
        continue-on-error: true
        working-directory: ${{ github.workspace }}\build
        run: ctest -C Release --output-on-failure

      - name: Package
        working-directory: ${{ github.workspace }}\build
        run: cpack -G ZIP -C Release

      # CPack alone produces plastimatch-1.10.0-win64.zip for every build. Rename so the
      # asset carries the platform, build date and commit: per-platform packages then don't
      # collide as release assets, and finalize-latest.yml can tell which commit an asset
      # came from.
      - name: Name the package
        id: pkg
        shell: pwsh
        working-directory: ${{ github.workspace }}\build
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Get-ChildItem -Filter 'plastimatch-*.zip' | Select-Object -First 1).Name
          $ver = [regex]::Match($src, '^plastimatch-([0-9][0-9.]*)-').Groups[1].Value
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $short = (git rev-parse --short=7 HEAD).Trim()
          $dst = "plastimatch-$ver-win64-$stamp-$short.zip"
          Move-Item $src $dst
          Expand-Archive -Path $dst -DestinationPath _peek -Force
          Get-ChildItem -Recurse _peek | Select-Object -ExpandProperty FullName
          Remove-Item -Recurse -Force _peek
          "name=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload package as artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: plastimatch-windows-package
          path: ${{ github.workspace }}\build\${{ steps.pkg.outputs.name }}

      - name: Upload package as artifact (retry)
        if: steps.upload-artifact.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: plastimatch-windows-package
          path: ${{ github.workspace }}\build\${{ steps.pkg.outputs.name }}

      # Tagged (stable) releases only. The rolling "latest" prerelease is (re)created by
      # finalize-latest.yml once every platform has finished building.
      - name: Publish package to the release
        if: ${{ github.event_name == 'release' && github.event.release.tag_name != 'latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}/build
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pkg.outputs.name }}" --clobber

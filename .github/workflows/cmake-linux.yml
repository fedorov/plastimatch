name: CI Linux

# Builds plastimatch on Linux and uploads a self-contained binary package.
#
# Dependency strategy (shared by all three platform workflows):
#
#   plastimatch's in-tree superbuild is dead code -- the block in src/CMakeLists.txt that
#   drives SuperBuild/External_ITK.cmake and SuperBuild/External_DCMTK.cmake is wrapped in
#   `if (false)`, and External_DCMTK.cmake still points at the retired offis ftp:// server.
#   So ITK and DCMTK have to be supplied by the CI job.
#
#   We build them from source as static Release libraries rather than using the distro
#   packages. Distro ITK/DCMTK are shared libraries under /usr/lib, so the resulting
#   plastimatch would only run on a machine that already has them installed -- not much use
#   as a downloadable package. Static builds cost ~25 min once and are then restored from
#   the actions cache, and give the same ITK/DCMTK version on Linux, macOS and Windows.
#
#   dlib is built the same way, for a different reason: see the DLIB_VERSION comment below.
#
#   Each dependency gets its own install prefix, cache entry and save step, so a failure in
#   one does not discard the others: if DCMTK breaks, the ITK cache is still banked and the
#   next run only retries DCMTK.
#
#   The remaining bundled libraries -- liblbfgs, inih, devillard, specfun, nkidecompress,
#   rapidjson, sqlite3 -- are built from libs/ as usual. The optional accelerators (FFTW,
#   nlopt, libyaml, Octave, wxWidgets, Qt, CUDA, OpenCL) are left out so all three platforms
#   produce a feature-identical package; add them per-platform later if wanted.
#
# Note on portability: the package is built on Ubuntu 24.04, so it needs glibc >= 2.39.
# Building inside a manylinux/dockcross image (as dcmqi does) would lower that floor.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ITK_VERSION: 5.4.0
  DCMTK_VERSION: 3.6.8
  # The bundled libs/dlib-19.1 cannot be used: it still relies on std::binary_function,
  # removed in C++17, and ITK 5.4 forces C++17 on consumers via
  # INTERFACE_COMPILE_FEATURES. plastimatch supports linking a real dlib -- the dlib .cpp
  # includes in src/sys/dlib_threads.cxx are guarded by !DLIB_HAVE_LIBRARY -- so build a
  # current one instead.
  DLIB_VERSION: 19.24.9
  # Per-dependency cache epochs. Because each dependency has its own cache entry, bumping
  # one rebuilds only that dependency -- useful after changing its cmake options, which are
  # not themselves part of the cache key.
  ITK_CACHE_EPOCH: v2
  DCMTK_CACHE_EPOCH: v3
  DLIB_CACHE_EPOCH: v3

jobs:
  build-linux:

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      # fetch-depth: 0 is required: CMakeLists.txt runs `git describe --always` to compute
      # PLASTIMATCH_VERSION_STRING and PLM_VERSION_TWEAK.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version
          ninja --version

      ##------------------------------------------------------------------------------
      ##  ITK
      ##------------------------------------------------------------------------------
      - name: Restore ITK cache
        id: cache-itk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/deps/itk
          key: linux-x86_64-itk-${{ env.ITK_CACHE_EPOCH }}-${{ env.ITK_VERSION }}

      # A cache saved from a half-finished build would have the CMake config files but not
      # the libraries, which only surfaces much later as a link error. Require a real library.
      - name: Check ITK cache
        id: check-itk
        run: |
          ok=false
          if [ "${{ steps.cache-itk.outputs.cache-hit }}" == "true" ] \
             && ls "${{ runner.temp }}"/deps/itk/lib/libITKCommon-*.a >/dev/null 2>&1; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable ITK cache: $ok"

      - name: Build ITK
        id: build-itk
        if: steps.check-itk.outputs.ok != 'true'
        run: |
          set -euo pipefail
          deps="${{ runner.temp }}/deps"
          mkdir -p "$deps/src" && cd "$deps/src"
          curl -fsSL -o itk.tar.gz \
            "https://github.com/InsightSoftwareConsortium/ITK/releases/download/v${ITK_VERSION}/InsightToolkit-${ITK_VERSION}.tar.gz"
          tar xzf itk.tar.gz
          cmake -S "$deps/src/InsightToolkit-${ITK_VERSION}" -B "$deps/build-itk" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$deps/itk" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DITK_USE_SYSTEM_ZLIB=OFF \
            -DModule_ITKReview=ON
          cmake --build "$deps/build-itk" --target install

      # Saved as soon as ITK itself is installed, so a later DCMTK/dlib/plastimatch failure
      # does not throw this build away. `cmake --build --target install` returning 0 means
      # the install tree is complete, which is a precise signal -- no need to proxy it
      # through the success of a later step. !cancelled() keeps the step eligible when a
      # later step has already failed; steps.build-itk.outcome does the real gating, so a
      # cancelled or failed ITK build is never snapshotted.
      - name: Save ITK cache
        if: ${{ !cancelled() && steps.build-itk.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/deps/itk
          key: ${{ steps.cache-itk.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  DCMTK
      ##------------------------------------------------------------------------------
      - name: Restore DCMTK cache
        id: cache-dcmtk
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/deps/dcmtk
          key: linux-x86_64-dcmtk-${{ env.DCMTK_CACHE_EPOCH }}-${{ env.DCMTK_VERSION }}

      - name: Check DCMTK cache
        id: check-dcmtk
        run: |
          ok=false
          if [ "${{ steps.cache-dcmtk.outputs.cache-hit }}" == "true" ] \
             && [ -f "${{ runner.temp }}/deps/dcmtk/lib/libdcmdata.a" ]; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable DCMTK cache: $ok"

      # CMAKE_CXX_STANDARD=17 matters: left at its default, DCMTK 3.6.8 reports "C++11
      # features disabled" and falls back to the pre-C++11 OFrvalue emulation in
      # ofstd/include/dcmtk/ofstd/ofutil.h, which newer compilers reject outright (AppleClang
      # 17: "no member named 'pt' in OFrvalue_storage<T, >"). plastimatch compiles those same
      # headers under C++17, so the emulation has to be off here too.
      #
      # BUILD_APPS=OFF skips the ~30 command line tools; plastimatch only links the
      # libraries. The optional backends are off to keep the static link self-contained
      # (costs deflated transfer syntax, TLS, and DICOM character-set conversion) and to keep
      # the three platforms configured identically.
      #
      # DCMTK_DEFAULT_DICT=builtin compiles the DICOM data dictionary into the library.
      # DCMTK defaults it to "builtin" only on Windows and to "external" on Unix, where the
      # dictionary is instead loaded at runtime from a file under the install prefix. That
      # file is not part of the plastimatch package, so a package built with the external
      # dictionary has no dictionary at all on a user's machine: DCMTK then resolves no VRs
      # and every DICOM read fails with "Sorry, could not load input as any known type"
      # (exit status 0, no output file). ctest does not catch it because the build machine
      # still has the file at the compiled-in path -- hence the packaged-binary smoke test
      # further down. DCMTK_ENABLE_PRIVATE_TAGS adds the private-tag dictionary that vendor
      # RT data relies on.
      - name: Build DCMTK
        id: build-dcmtk
        if: steps.check-dcmtk.outputs.ok != 'true'
        run: |
          set -euo pipefail
          deps="${{ runner.temp }}/deps"
          mkdir -p "$deps/src" && cd "$deps/src"
          curl -fsSL -o dcmtk.tar.gz \
            "https://github.com/DCMTK/dcmtk/archive/refs/tags/DCMTK-${DCMTK_VERSION}.tar.gz"
          tar xzf dcmtk.tar.gz
          cmake -S "$deps/src/dcmtk-DCMTK-${DCMTK_VERSION}" -B "$deps/build-dcmtk" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$deps/dcmtk" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_STANDARD=17 \
            -DDCMTK_ENABLE_CXX11=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DDCMTK_WITH_ZLIB=OFF \
            -DDCMTK_WITH_OPENSSL=OFF \
            -DDCMTK_WITH_PNG=OFF \
            -DDCMTK_WITH_TIFF=OFF \
            -DDCMTK_WITH_XML=OFF \
            -DDCMTK_WITH_ICONV=OFF \
            -DDCMTK_WITH_ICU=OFF \
            -DDCMTK_WITH_SNDFILE=OFF \
            -DDCMTK_DEFAULT_DICT=builtin \
            -DDCMTK_ENABLE_PRIVATE_TAGS=ON \
            -DDCMTK_ENABLE_CHARSET_CONVERSION=OFF
          cmake --build "$deps/build-dcmtk" --target install

      - name: Save DCMTK cache
        if: ${{ !cancelled() && steps.build-dcmtk.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/deps/dcmtk
          key: ${{ steps.cache-dcmtk.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  dlib
      ##------------------------------------------------------------------------------
      - name: Restore dlib cache
        id: cache-dlib
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/deps/dlib
          key: linux-x86_64-dlib-${{ env.DLIB_CACHE_EPOCH }}-${{ env.DLIB_VERSION }}

      - name: Check dlib cache
        id: check-dlib
        run: |
          ok=false
          if [ "${{ steps.cache-dlib.outputs.cache-hit }}" == "true" ] \
             && [ -f "${{ runner.temp }}/deps/dlib/lib/libdlib.a" ]; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Usable dlib cache: $ok"

      # Minimal dlib: plastimatch only uses the optimization, threading, svm and command
      # line parser headers, so the GUI/BLAS backends are off to keep the static link
      # self-contained.
      #
      # PNG and JPEG support must stay ON even though plastimatch never loads images.
      # dlib/image_io.h -- reached via dlib/data_io.h -- unconditionally includes
      # png_loader.h and jpeg_loader.h, and with support off both spell their guard as
      # COMPILE_TIME_ASSERT(sizeof(T) == 0). T is an undeclared, non-dependent name, so that
      # is a hard parse-time error rather than one deferred to instantiation.
      # PNG_FOUND=0/JPEG_FOUND=0 take the deliberate early-out in dlib's
      # cmake_utils/find_lib{png,jpeg}.cmake ("if (DEFINED ..._FOUND) return()"), which makes
      # dlib statically compile its own bundled libpng/zlib/libjpeg into libdlib.a instead of
      # linking the system copies -- so the package stays self-contained.
      - name: Build dlib
        id: build-dlib
        if: steps.check-dlib.outputs.ok != 'true'
        run: |
          set -euo pipefail
          deps="${{ runner.temp }}/deps"
          mkdir -p "$deps/src" && cd "$deps/src"
          curl -fsSL -o dlib.tar.gz \
            "https://github.com/davisking/dlib/archive/refs/tags/v${DLIB_VERSION}.tar.gz"
          tar xzf dlib.tar.gz
          cmake -S "$deps/src/dlib-${DLIB_VERSION}" -B "$deps/build-dlib" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$deps/dlib" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_STANDARD=17 \
            -DBUILD_SHARED_LIBS=OFF \
            -DDLIB_NO_GUI_SUPPORT=ON \
            -DDLIB_PNG_SUPPORT=ON \
            -DPNG_FOUND=0 \
            -DDLIB_JPEG_SUPPORT=ON \
            -DJPEG_FOUND=0 \
            -DDLIB_GIF_SUPPORT=OFF \
            -DDLIB_WEBP_SUPPORT=OFF \
            -DDLIB_USE_BLAS=OFF \
            -DDLIB_USE_LAPACK=OFF \
            -DDLIB_USE_CUDA=OFF \
            -DDLIB_USE_MKL_FFT=OFF \
            -DDLIB_LINK_WITH_SQLITE3=OFF
          cmake --build "$deps/build-dlib" --target install

      - name: Save dlib cache
        if: ${{ !cancelled() && steps.build-dlib.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/deps/dlib
          key: ${{ steps.cache-dlib.outputs.cache-primary-key }}

      ##------------------------------------------------------------------------------
      ##  plastimatch
      ##------------------------------------------------------------------------------
      # dlib_INCLUDE_DIR is passed explicitly because src/CMakeLists.txt copies it into
      # DLIB_INCLUDE_DIR, which src/clp consumes as a plain include path rather than through
      # the dlib::dlib target.
      # CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON is required for dlib. On a case-insensitive
      # filesystem (macOS), find_package(dlib) looking for "Finddlib.cmake" in MODULE mode
      # matches plastimatch's own cmake/FindDlib.cmake, a legacy module that searches for a
      # system dlib, fails, and prevents CONFIG mode from ever running -- so dlib_DIR was
      # ignored as an unused variable and the bundled libs/dlib-19.1 got compiled instead.
      # Preferring CONFIG picks up dlibConfig.cmake and makes all platforms resolve
      # dependencies the same way; packages without a config file still fall back to MODULE.
      - name: Configure plastimatch
        run: |
          set -euo pipefail
          deps="${{ runner.temp }}/deps"
          # Locate the config files rather than hardcoding paths: the exact subdirectory
          # depends on the ITK version and on each project's CMAKE_INSTALL_LIBDIR.
          itk_dir=$(dirname "$(find "$deps/itk" -name ITKConfig.cmake -print -quit)")
          dcmtk_dir=$(dirname "$(find "$deps/dcmtk" -name DCMTKConfig.cmake -print -quit)")
          dlib_dir=$(dirname "$(find "$deps/dlib" -name dlibConfig.cmake -print -quit)")
          echo "ITK_DIR=$itk_dir"
          echo "DCMTK_DIR=$dcmtk_dir"
          echo "dlib_DIR=$dlib_dir"
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DBUILD_SHARED_LIBS=OFF \
            -DITK_DIR="$itk_dir" \
            -DDCMTK_DIR="$dcmtk_dir" \
            -Ddlib_DIR="$dlib_dir" \
            -Ddlib_INCLUDE_DIR="$deps/dlib/include" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            -DPLM_SYSTEM_ITK=YES \
            -DPLM_SYSTEM_DCMTK=YES \
            -DPLM_PREFER_SYSTEM_DLIB=ON \
            -DPLM_CONFIG_ENABLE_CUDA=OFF \
            -DPLM_CONFIG_ENABLE_OPENCL=OFF \
            -DPLM_CONFIG_ENABLE_QT=OFF \
            -DPLM_CONFIG_ENABLE_OPENMP=ON \
            -DPLM_CONFIG_ENABLE_SSE2=ON \
            -DPLM_BUILD_TESTING=ON

      - name: Build plastimatch
        run: cmake --build "${{ github.workspace }}/build"

      # Informational for now: the regression suite has never run in GitHub Actions, so it
      # is not yet gating. Drop continue-on-error once it is known green here.
      - name: Test
        continue-on-error: true
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure

      - name: Package
        working-directory: ${{ github.workspace }}/build
        run: cpack -G ZIP

      # CPack alone produces plastimatch-1.10.0-Linux.zip for every build. Rename so the
      # asset carries the platform, build date and commit: per-platform packages then don't
      # collide as release assets, and finalize-latest.yml can tell which commit an asset
      # came from.
      - name: Name the package
        id: pkg
        working-directory: ${{ github.workspace }}/build
        run: |
          set -euo pipefail
          src=$(ls plastimatch-*.zip)
          ver=$(echo "$src" | sed -E 's/^plastimatch-([0-9][0-9.]*)-.*/\1/')
          dst="plastimatch-${ver}-linux-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD).zip"
          mv "$src" "$dst"
          unzip -l "$dst"
          echo "name=$dst" >> "$GITHUB_OUTPUT"

      # Exercise the packaged binary, not the build tree. ctest runs against the build
      # directory, where files that the package omits are still lying around -- that is how a
      # DCMTK built with an external data dictionary passed 578/578 tests while every DICOM
      # read in the shipped zip failed. This extracts the archive somewhere clean, scrubs
      # DCMDICTPATH so no host dictionary can be picked up, and checks a real DICOM
      # round-trip. Note that `plastimatch convert` exits 0 even when it cannot read its
      # input, so the assertions are on the output files, not the exit status.
      - name: Smoke-test the package
        working-directory: ${{ github.workspace }}/build
        run: |
          set -euo pipefail
          unset DCMDICTPATH
          smoke=$(mktemp -d)
          unzip -q "${{ steps.pkg.outputs.name }}" -d "$smoke"
          bin=$(find "$smoke" -type f -name plastimatch -perm -u+x -print -quit)
          echo "testing $bin"
          "$bin" --version
          "$bin" synth --output "$smoke/s.mha" --pattern sphere --dim 24 \
            --origin "-24 -24 -24" --spacing "2 2 2" --center "0 0 0" --radius 12
          test -s "$smoke/s.mha" || { echo "::error::packaged binary could not write an image"; exit 1; }
          "$bin" convert --input "$smoke/s.mha" --output-dicom "$smoke/dcm" --output-type short
          test -n "$(ls -A "$smoke/dcm" 2>/dev/null)" || { echo "::error::packaged binary wrote no DICOM"; exit 1; }
          "$bin" convert --input "$smoke/dcm" --output-img "$smoke/rt.mha"
          test -s "$smoke/rt.mha" || {
            echo "::error::packaged binary could not read back DICOM -- is the DCMTK data dictionary compiled in?"
            exit 1; }
          "$bin" header "$smoke/rt.mha" | tee "$smoke/hdr.txt"
          grep -q "Size = 24 24 24" "$smoke/hdr.txt" || { echo "::error::DICOM round-trip lost image geometry"; exit 1; }
          echo "packaged binary OK: image I/O, DICOM write and DICOM read all work"

      - name: Upload package as artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: plastimatch-linux-package
          path: ${{ github.workspace }}/build/${{ steps.pkg.outputs.name }}

      - name: Upload package as artifact (retry)
        if: steps.upload-artifact.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: plastimatch-linux-package
          path: ${{ github.workspace }}/build/${{ steps.pkg.outputs.name }}

      # Tagged (stable) releases only. The rolling "latest" prerelease is (re)created by
      # finalize-latest.yml once every platform has finished building.
      - name: Publish package to the release
        if: ${{ github.event_name == 'release' && github.event.release.tag_name != 'latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}/build
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pkg.outputs.name }}" --clobber
